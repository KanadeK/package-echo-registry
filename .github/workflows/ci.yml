name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-echo-test-evidence
          path: |
            coverage/
            playwright-report/
            docs/assets/dashboard.png
          retention-days: 14

  portability:
    name: ${{ matrix.os }} unit and integration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: Release packaging smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: package-echo-release-candidate
          path: dist-release/
          retention-days: 14
