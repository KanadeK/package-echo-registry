name: Feature request
description: Propose a concrete analysis, adapter, report, or interface improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the maintenance decision that is difficult today.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Desired evidence
      description: Describe the input, output, and evidence path the feature should produce.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and compatibility boundaries
      description: Note offline requirements, supported formats, or sensitive data concerns.
    validations:
      required: true
